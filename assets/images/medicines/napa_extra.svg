  <text x="50" y="52" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">GENUINE</text>
  <!-- Brand Text -->
  <text x="88" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="1">Napa Extra</text>
  <text x="88" y="66" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fecdd3">Paracetamol 500mg + Caffeine 65mg</text>
  <text x="370" y="48" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="end">SQUARE</text>
  <text x="370" y="65" font-family="Arial, sans-serif" font-size="10" fill="#fecdd3" text-anchor="end">DAR-024-0312</text>
  
  <!-- Blister Pockets -->
  <g fill="#ffffff" stroke="#cbd5e1" stroke-width="2" opacity="0.9">
    <rect x="35" y="105" width="55" height="45" rx="22" fill="#f1f5f9"/>
    <rect x="105" y="105" width="55" height="45" rx="22" fill="#f1f5f9"/>
    <rect x="175" y="105" width="55" height="45" rx="22" fill="#f1f5f9"/>
    <rect x="245" y="105" width="55" height="45" rx="22" fill="#f1f5f9"/>
    <rect x="315" y="105" width="55" height="45" rx="22" fill="#f1f5f9"/>
    
    <rect x="35" y="165" width="55" height="45" rx="22" fill="#f1f5f9"/>
    <rect x="105" y="165" width="55" height="45" rx="22" fill="#f1f5f9"/>
    <rect x="175" y="165" width="55" height="45" rx="22" fill="#f1f5f9"/>
    <rect x="245" y="165" width="55" height="45" rx="22" fill="#f1f5f9"/>
    <rect x="315" y="165" width="55" height="45" rx="22" fill="#f1f5f9"/>
  </g>
  <!-- Microprint Security line -->
  <line x1="25" y1="222" x2="375" y2="222" stroke="#e11d48" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="200" y="230" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">AUTHENTIC SQUARE PACKAGING • BATCH NO: SQ-NPA-2026B1</text>
