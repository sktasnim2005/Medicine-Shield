<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="napaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect x="10" y="10" width="380" height="230" rx="16" fill="url(#foilGrad)" stroke="#94a3b8" stroke-width="2"/>
  <!-- Header Bar -->
  <rect x="10" y="10" width="380" height="75" rx="16" fill="url(#napaGrad)"/>
  <rect x="10" y="70" width="380" height="15" fill="url(#napaGrad)"/>
  <!-- Holographic Emblem -->
  <circle cx="50" cy="47" r="24" fill="#ffffff" opacity="0.2"/>
